<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청학골 메뉴</title>
<meta name="theme-color" content="#2f6f5e">
<style>body{margin:0;background:#eef0f4}@media(prefers-color-scheme:dark){body{background:#0e1014}}</style>
</head>
<body>
<script>
// ============================================================
//  청학골 전용 주소 (…/wuxi-menu/chg/)
// ------------------------------------------------------------
//  메뉴 데이터·화면은 상위 폴더의 index.html 하나만 관리합니다.
//  이 파일은 그 index.html을 불러와 "청학골만 보기" 모드로 띄웁니다.
//  · 다른 음식점 전용 주소를 만들려면 이 폴더를 복사하고 ONLY·NAME 값만 바꾸세요
//    (음식점 id: chg / hbg / gbg / hg / lj / jis)
// ============================================================
const ONLY = "chg";
const NAME = "청학골";
fetch("../index.html", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(html => {
    html = html
      // 사진·아이콘·sw.js 등 상대 경로를 상위 폴더 기준으로
      .replace("<head>", `<head>\n<base href="../">\n<script>window.MENU_ONLY = "${ONLY}";<\/script>`)
      // 홈 화면에 추가 시 이 음식점 전용 앱으로 설치되도록
      .replace('href="manifest.webmanifest"', `href="${ONLY}/manifest.webmanifest"`)
      .replace('name="apple-mobile-web-app-title" content="우시맛집메뉴판"', `name="apple-mobile-web-app-title" content="${NAME}"`);
    document.open();
    document.write(html);
    document.close();
  })
  .catch(() => {
    document.body.innerHTML = '<p style="font-family:sans-serif;padding:24px">메뉴를 불러오지 못했습니다. <a href="../">전체 메뉴판으로 이동</a></p>';
  });
</script>
</body>
</html>
