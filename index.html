<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>청학골 · 홍보각 · 경복궁 · 란조라면 · 지스김밥 메뉴 주문</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#c8161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우시맛집메뉴판">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   디자인 토큰
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #eef0f4;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #171a20;
  --muted: #6b7382;
  --line: #e3e6ec;
  --chip-bg: #ffffff;
  --shadow-lg: 0 18px 40px -12px rgba(23, 26, 32, .18);
  --shadow-md: 0 8px 20px -8px rgba(23, 26, 32, .16);
  --shadow-sm: 0 2px 6px rgba(23, 26, 32, .07);
  --accent: #23262d;          /* 음식점 선택 시 JS가 교체 */
  --accent-2: #3a3f4a;
  --on-accent: #ffffff;
  --radius: 16px;
  --stepper-off: #eceef2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1014;
    --surface: #171a21;
    --surface-2: #1e222b;
    --ink: #f0f2f6;
    --muted: #9aa3b4;
    --line: #2a2f3a;
    --chip-bg: #1e222b;
    --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, .6);
    --shadow-md: 0 8px 20px -8px rgba(0, 0, 0, .5);
    --shadow-sm: 0 2px 6px rgba(0, 0, 0, .35);
    --stepper-off: #262b36;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014;
  --surface: #171a21;
  --surface-2: #1e222b;
  --ink: #f0f2f6;
  --muted: #9aa3b4;
  --line: #2a2f3a;
  --chip-bg: #1e222b;
  --shadow-lg: 0 18px 40px -12px rgba(0, 0, 0, .6);
  --shadow-md: 0 8px 20px -8px rgba(0, 0, 0, .5);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, .35);
  --stepper-off: #262b36;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: "Noto Sans KR", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
}
button {
  font: inherit; color: inherit; border: 0; background: none; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
[hidden] { display: none !important; }

/* 숫자는 자릿수 정렬 */
.num { font-variant-numeric: tabular-nums; }

/* ============================================================
   홈 — 음식점 선택
   ============================================================ */
#screen-home {
  max-width: 560px;
  margin: 0 auto;
  padding: clamp(40px, 10vw, 80px) 20px 48px;
}
.home-eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-size: 12px; font-weight: 700; letter-spacing: .22em;
  text-transform: uppercase; color: var(--muted);
}
.home-eyebrow::before {
  content: ""; width: 26px; height: 2px; background: var(--muted); border-radius: 1px;
}
.home-title {
  font-size: clamp(28px, 7.5vw, 38px);
  font-weight: 900;
  letter-spacing: -.02em;
  margin: 14px 0 6px;
  text-wrap: balance;
}
.home-sub { color: var(--muted); font-size: 15px; margin-bottom: 34px; }

.rest-card {
  position: relative;
  display: block; width: 100%; text-align: left;
  background: var(--surface);
  border-radius: 22px;
  padding: 26px 24px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--line);
  transition: transform .18s ease, box-shadow .18s ease;
  overflow: hidden;
}
.rest-card::after {
  /* 오른쪽 브랜드 컬러 리본 */
  content: ""; position: absolute; inset: 0 0 0 auto; width: 6px;
  background: linear-gradient(180deg, var(--rc-accent), var(--rc-accent-2));
}
.rest-card:active { transform: scale(.985); }
@media (hover: hover) {
  .rest-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
}
.rest-head { display: flex; align-items: center; gap: 16px; }
.rest-mark {
  flex: none;
  width: 58px; height: 58px;
  border-radius: 16px;
  display: grid; place-items: center;
  color: #fff; font-weight: 900; font-size: 22px;
  box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.25);
}
.rest-name { font-size: 21px; font-weight: 900; letter-spacing: -.01em; }
.rest-tag {
  display: inline-block; margin-top: 3px;
  font-size: 12.5px; font-weight: 500; color: var(--muted);
}
.rest-meta {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px dashed var(--line);
  display: flex; align-items: baseline; justify-content: space-between;
  color: var(--muted); font-size: 13px;
}
.rest-meta .num { color: var(--ink); font-weight: 700; font-size: 14px; }
.rest-go { font-size: 14px; font-weight: 700; color: var(--rc-accent); }

.home-footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }

/* ============================================================
   메뉴 화면 공통
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px);
}
.topbar-inner {
  display: flex; align-items: center; gap: 12px;
  max-width: 1080px; margin: 0 auto;
  padding: 10px 16px;
}
.btn-back {
  flex: none;
  width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center;
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: transform .12s ease;
}
.btn-back:active { transform: scale(.92); }
.topbar-title { flex: 1; min-width: 0; }
.topbar-name { font-size: 17px; font-weight: 900; line-height: 1.2; }
.topbar-tag { font-size: 12px; color: var(--muted); font-weight: 500; }
.btn-theme {
  flex: none;
  width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center;
  background: var(--surface-2);
  border: 1px solid var(--line);
  transition: transform .12s ease;
}
.btn-theme:active { transform: scale(.92); }
.btn-theme svg { width: 20px; height: 20px; }

/* 검색 */
.search-wrap {
  max-width: none; margin: 0 auto;
  padding: 12px 16px 0;
}
@media (min-width: 960px) {
  .search-wrap { padding: 12px 28px 0; }
  .chip-row { padding: 12px 28px; }
}
.search-box {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 0 14px;
}
.search-box svg { width: 17px; height: 17px; color: var(--muted); flex: none; }
.search-box input {
  flex: 1; min-width: 0;
  border: 0; background: none; color: var(--ink);
  font: inherit; font-size: 14.5px;
  padding: 11px 0;
}
.search-box input::placeholder { color: var(--muted); }
.search-box input:focus { outline: none; }
.search-box:focus-within { border-color: var(--accent); }

/* 카테고리 칩 (가로 스크롤) */
.chip-row {
  max-width: none; margin: 0 auto;
  display: flex; gap: 8px;
  padding: 12px 16px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  padding: 8px 15px;
  border-radius: 999px;
  background: var(--chip-bg);
  border: 1px solid var(--line);
  font-size: 13.5px; font-weight: 700;
  color: var(--muted);
  box-shadow: var(--shadow-sm);
  white-space: nowrap;
  transition: all .15s ease;
}
.chip.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  border-color: transparent;
  color: var(--on-accent);
  box-shadow: 0 6px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent);
}

/* 메뉴 본문 */
.menu-body {
  max-width: 1080px; margin: 0 auto;
  padding: 4px 16px calc(120px + env(safe-area-inset-bottom, 0px));
}
/* 화면 폭에 따라 컬럼 수 자동 확장 (모바일 1열 → 넓은 화면 최대 3열) */
@media (min-width: 720px) {
  .menu-list { grid-template-columns: repeat(2, 1fr); }
}
.cat-section {
  padding-top: 10px;
  scroll-margin-top: 16px;
}
.cat-title-wrap {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px;
  padding: 10px 2px 12px;
}
.cat-title {
  font-size: 17px; font-weight: 900; letter-spacing: -.01em;
  white-space: nowrap;
}
.cat-cn { white-space: nowrap; }
.cat-title::before {
  content: ""; display: inline-block;
  width: 8px; height: 8px; border-radius: 3px;
  margin-right: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  transform: rotate(45deg);
}
.cat-note { font-size: 12px; color: var(--muted); font-weight: 500; }
.cat-cn { font-size: 13px; font-weight: 400; color: var(--muted); }

.menu-list { display: grid; gap: 8px; }

/* 메뉴 아이템 카드 */
.item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.item.in-cart {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  box-shadow: 0 4px 14px -6px color-mix(in srgb, var(--accent) 45%, transparent);
}
.item-info { flex: 1; min-width: 0; }
.item-name {
  font-size: 15px; font-weight: 700;
  overflow-wrap: break-word;
}
.item-name.dim { color: var(--muted); }
.item-cn {
  font-size: 12.5px; font-weight: 400;
  color: var(--muted);
  margin-left: 6px;
}
.item-desc {
  font-size: 12px; font-weight: 400;
  color: var(--muted);
  margin-top: 2px;
  line-height: 1.35;
}
.item-price {
  font-size: 14px; font-weight: 700; color: var(--muted);
  margin-top: 2px;
}
.item-price.hot { color: var(--accent); }

/* 추가 버튼 / 수량 스테퍼 */
.add-btn {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 14px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent);
  box-shadow: 0 6px 14px -4px color-mix(in srgb, var(--accent) 55%, transparent),
             inset 0 1px 0 rgba(255,255,255,.22);
  transition: transform .12s ease;
}
.add-btn:active { transform: scale(.9); }
.add-btn:disabled {
  background: var(--stepper-off);
  color: var(--muted);
  box-shadow: none;
  cursor: not-allowed;
}
.add-btn svg { width: 18px; height: 18px; }

.stepper {
  flex: none;
  display: flex; align-items: center;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.stepper button {
  width: 40px; height: 44px;
  display: grid; place-items: center;
  font-size: 19px; font-weight: 700;
  color: var(--accent);
  transition: background .12s ease;
}
.stepper button:active { background: var(--stepper-off); }
.stepper .qty {
  min-width: 30px; text-align: center;
  font-size: 15.5px; font-weight: 900;
}
.stepper svg { width: 14px; height: 14px; }

/* 사진 메뉴판 (photoMenu) — 2열 사진 카드 */
.photo-grid .menu-list.has-photo { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 640px) { .photo-grid .menu-list.has-photo { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.photo-grid .has-photo .item {
  flex-direction: column; align-items: stretch; gap: 8px;
  padding: 8px 8px 10px;
}
.item-photo {
  display: block; width: 100%; aspect-ratio: 1;
  border-radius: 10px; overflow: hidden;
  background: var(--surface-2);
  cursor: zoom-in;
}
.item-photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.photo-grid .has-photo .item-info { flex: none; padding: 0 2px; }
.photo-grid .has-photo .item-cn { display: block; margin-left: 0; }
.photo-grid .has-photo .add-btn { width: 100%; height: 40px; border-radius: 12px; margin-top: auto; }
.photo-grid .has-photo .stepper { justify-content: space-between; margin-top: auto; }
.photo-grid .has-photo .stepper button { height: 40px; }

/* 사진 크게 보기 */
.lightbox {
  position: fixed; inset: 0; z-index: 70;
  display: grid; place-items: center; padding: 20px;
  background: rgba(10, 12, 16, .82);
}
.lightbox[hidden] { display: none; }
.lightbox figure { margin: 0; max-width: 560px; width: 100%; text-align: center; color: #fff; }
.lightbox img {
  width: 100%; max-height: 70vh; object-fit: contain;
  border-radius: 16px; background: #f4f1ea;
}
.lightbox figcaption { margin-top: 12px; font-size: 17px; font-weight: 700; }
.lightbox figcaption span { display: block; font-size: 13px; font-weight: 400; opacity: .75; margin-top: 2px; }

/* 검색 결과 없음 */
.no-result {
  padding: 60px 20px; text-align: center; color: var(--muted);
  font-size: 14.5px;
}

/* ============================================================
   하단 결제 바 (모바일) + 사이드바 (데스크톱)
   ============================================================ */
.cartbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 0 16px calc(12px + env(safe-area-inset-bottom, 0px));
  pointer-events: none; /* 바 자체는 비활성, 내부 버튼만 클릭 */
}
.cartbar-btn {
  pointer-events: auto;
  width: 100%;
  max-width: 1048px;
  margin: 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-radius: 18px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: var(--on-accent);
  font-weight: 700;
  box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.18);
  transform: translateY(0);
  transition: transform .25s ease;
}
.cartbar-btn:active { transform: translateY(1px) scale(.99); }
.cartbar-btn .badge {
  background: rgba(255,255,255,.22);
  border-radius: 999px;
  padding: 2px 11px;
  font-size: 13px; font-weight: 800;
}
.cartbar-btn .grow { flex: 1; text-align: left; font-size: 14.5px; }
.cartbar-btn .total {
  font-size: 18px; font-weight: 900;
}
.cartbar-btn .chev { width: 18px; height: 18px; flex: none; }
.cartbar-empty {
  pointer-events: auto;
  width: 100%;
  max-width: 1048px;
  margin: 0 auto;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 14px; font-weight: 600;
  box-shadow: var(--shadow-md);
}

/* 장바구니 시트 (모바일) */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10, 12, 16, .45);
  opacity: 0; pointer-events: none;
  transition: opacity .22s ease;
}
.sheet-backdrop.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 61;
  max-width: 560px; margin: 0 auto;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  box-shadow: var(--shadow-lg);
  max-height: 78dvh;
  display: flex; flex-direction: column;
  transform: translateY(105%);
  transition: transform .28s cubic-bezier(.32, .72, .32, 1);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sheet.open { transform: translateY(0); }
.sheet-grab { padding: 10px 0 2px; display: grid; place-items: center; }
.sheet-grab::before {
  content: ""; width: 40px; height: 4px; border-radius: 2px;
  background: var(--line);
}
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px 12px;
}
.sheet-head h2 { font-size: 17px; font-weight: 900; flex: 1; }
.btn-clear {
  font-size: 13px; font-weight: 700; color: var(--muted);
  padding: 7px 12px; border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.sheet-list {
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: 2px 16px 12px;
  display: grid; gap: 8px;
  align-content: start;
}
.cart-item {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
}
.cart-item .ci-info { flex: 1; min-width: 0; }
.cart-item .ci-name { font-size: 14px; font-weight: 700; overflow-wrap: break-word; }
.cart-item .ci-cn {
  font-size: 12.5px; font-weight: 400;
  color: var(--muted);
  margin-left: 5px;
}
.cart-item .ci-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.cart-item .stepper { border-radius: 11px; }
.cart-item .stepper button { width: 36px; height: 38px; }
.cart-item .stepper .qty { min-width: 26px; font-size: 14px; }
.sheet-empty { padding: 44px 20px; text-align: center; color: var(--muted); font-size: 14px; }
.sheet-foot {
  padding: 12px 20px 18px;
  border-top: 1px solid var(--line);
  background: var(--surface);
  border-radius: 0 0 0 0;
}
.total-row {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 4px 2px 12px;
}
.total-row .label { font-size: 14px; font-weight: 700; color: var(--muted); }
.total-row .amount {
  font-size: 26px; font-weight: 900; letter-spacing: -.02em;
  color: var(--ink);
}

/* ============================================================
   데스크톱: 사이드 카트
   ============================================================ */
.cart-aside { display: none; }

@media (min-width: 960px) {
  .cartbar { display: none; }
  .sheet-backdrop, .sheet { display: none; }
  .menu-body {
    padding: 4px 16px 48px;
  }
  .menu-layout {
    max-width: 1080px; margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 28px;
    align-items: start;
    padding: 0 28px;
  }
  .cart-aside {
    display: flex; flex-direction: column;
    position: sticky;
    /* 헤더 실측 높이(JS가 --topbar-h로 제공)보다 아래에, 화면 안에 전체가 들어오게 */
    top: calc(var(--topbar-h, 176px) + 16px);
    max-height: calc(100dvh - var(--topbar-h, 176px) - 32px);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: var(--shadow-md);
    overflow: hidden;
  }
  .cart-aside-head {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 16px 18px 12px;
  }
  .cart-aside-head h2 { font-size: 16px; font-weight: 900; flex: 1; }
  .cart-aside-list {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 0 14px 10px;
    display: grid; gap: 8px;
    align-content: start;
  }
  .cart-aside-foot {
    flex: none;
    padding: 12px 18px 16px;
    border-top: 1px solid var(--line);
    background: var(--surface-2);
  }
}
@media (min-width: 1400px) {
  .menu-layout { max-width: 1560px; }
  .menu-list { grid-template-columns: repeat(3, 1fr); }
  .menu-body { max-width: none; padding: 4px 0 48px; }
}
@media (min-width: 2000px) {

<script>
"use strict";

/* ============================================================
   앱 상태
   ============================================================ */
const RESTAURANTS = [RESTAURANT_CHG, RESTAURANT_HBG, RESTAURANT_GBG, RESTAURANT_GBGP, RESTAURANT_LJ, RESTAURANT_JIS];
let currentId = null;              // "chg" | "hbg" | "gbg" | "gbgp" | "lj" | "jis"
// 저장된 카트에 새 음식점 키가 없으면 보충 (기존 사용자 호환)
const carts = load("menu-carts", {});
for (const r of RESTAURANTS) if (!carts[r.id]) carts[r.id] = {};
let themePref = load("menu-theme", null);               // "light" | "dark" | null(시스템)

function load(key, fallback) {
  try {
    const v = JSON.parse(localStorage.getItem(key));
    return v ?? fallback;
  } catch { return fallback; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch { /* 저장 불가 환경 무시 */ }
}
const $ = (id) => document.getElementById(id);
const rest = () => RESTAURANTS.find(r => r.id === currentId);

/* ============================================================
   가격 표시
   ============================================================ */
function fmtPrice(v, cur) {
  if (typeof v !== "number") return "시가";
  return cur === "원" ? v.toLocaleString("ko-KR") + "원" : v + "元";
}
function isMarket(v) { return typeof v !== "number"; }

/* ============================================================
   홈 화면
   ============================================================ */
function renderHome() {
  $("home-cards").innerHTML = RESTAURANTS.map(r => {
    const count = r.categories.reduce((n, c) => n + c.items.length, 0);
    return `
      <button class="rest-card" data-id="${r.id}"
              style="--rc-accent:${r.accent}; --rc-accent-2:${r.accent2}">
        <div class="rest-head">
          <span class="rest-mark" style="background:linear-gradient(135deg,${r.accent},${r.accent2})">${r.mark}</span>
          <div>
            <div class="rest-name">${r.name}</div>
            <div class="rest-tag">${r.tagline}</div>
          </div>
        </div>
        <div class="rest-meta">
          <span>메뉴 <span class="num">${count}</span>개</span>
          <span class="rest-go">메뉴 보기 →</span>
        </div>
      </button>`;
  }).join("");

  document.querySelectorAll(".rest-card").forEach(btn =>
    btn.addEventListener("click", () => openRestaurant(btn.dataset.id)));
}

/* ============================================================
   메뉴 화면 렌더링
   ============================================================ */
function openRestaurant(id) {
  currentId = id;
  const r = rest();
  document.documentElement.style.setProperty("--accent", r.accent);
  document.documentElement.style.setProperty("--accent-2", r.accent2);
  document.documentElement.style.setProperty("--on-accent",
    pickOnColor(r.accent));

  $("tb-name").textContent = r.name;
  $("tb-tag").textContent = r.tagline;
  $("search-input").value = "";

  renderChips();
  renderMenu();
  renderCarts();

  $("screen-home").hidden = true;
  $("screen-menu").hidden = false;
  requestAnimationFrame(() => {
    measureTopbar();
    syncChips();
  });
  window.scrollTo(0, 0);
}

/* 밝은 글자 / 어두운 글자 자동 판단 */
function pickOnColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = 0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255);
  return lum > 168 ? "#171a20" : "#ffffff";
}

function renderChips() {
  const r = rest();
  $("chip-row").innerHTML =
    `<button class="chip active" data-cat="all">전체</button>` +
    r.categories.map(c =>
      `<button class="chip" data-cat="${encodeURIComponent(c.name)}">${c.name}</button>`).join("");
}

function renderMenu(filter = "") {
  const r = rest();
  const q = filter.trim().toLowerCase();
  let sectionsHtml = "";
  let found = 0;

  for (const cat of r.categories) {
    const items = cat.items.filter(it => !q ||
      it.name.toLowerCase().includes(q) ||
      (it.cn || "").toLowerCase().includes(q) ||
      (it.desc || "").toLowerCase().includes(q));
    if (!items.length) continue;
    found += items.length;

    sectionsHtml += `
      <section class="cat-section" id="cat-${encodeURIComponent(cat.name)}">
        <div class="cat-title-wrap">
          <h3 class="cat-title">${cat.name}</h3>
          ${cat.cn ? `<span class="cat-cn">(${cat.cn})</span>` : ""}
          ${cat.note ? `<span class="cat-note">${cat.note}</span>` : ""}
        </div>
        <div class="menu-list ${r.photoMenu && items.some(it => it.img) ? "has-photo" : ""}">
          ${items.map(it => itemRow(it)).join("")}
        </div>
      </section>`;
  }

  $("menu-body").classList.toggle("photo-grid", !!r.photoMenu);
  $("menu-body").innerHTML =
    found ? sectionsHtml
          : `<div class="no-result">"${filter}"에 해당하는 메뉴가 없습니다.</div>`;

  bindItemButtons();
  updateItemStates();
}

function itemRow(it) {
  const market = isMarket(it.price);
  const qty = carts[currentId][it.name] || 0;
  return `
    <div class="item ${qty ? "in-cart" : ""}" data-name="${escapeAttr(it.name)}">
      ${it.img && rest().photoMenu
        ? `<button class="item-photo" data-zoom="${escapeAttr(it.name)}" aria-label="${escapeAttr(it.name)} 사진 크게 보기">
             <img src="${it.img}" alt="" loading="lazy" decoding="async">
           </button>`
        : ""}
      <div class="item-info">
        <div class="item-name ${market ? "dim" : ""}">${it.name}${it.cn ? `<span class="item-cn">(${it.cn})</span>` : ""}</div>
        ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ""}
        <div class="item-price num ${market ? "" : "hot"}">${fmtPrice(it.price, rest().currency)}</div>
      </div>
      ${market
        ? `<button class="add-btn" disabled aria-label="시가 메뉴" title="시가 — 매장에 문의">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v.01M12 11.5v4.5"/><circle cx="12" cy="12" r="9.2"/></svg>
           </button>`
        : qty === 0
          ? `<button class="add-btn" data-add="${escapeAttr(it.name)}" aria-label="${it.name} 담기">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
             </button>`
          : stepperHtml(it.name, qty)}
    </div>`;
}

function stepperHtml(name, qty) {
  return `
    <div class="stepper">
      <button data-minus="${escapeAttr(name)}" aria-label="수량 줄이기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <span class="qty num">${qty}</span>
      <button data-plus="${escapeAttr(name)}" aria-label="수량 늘리기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>`;
}

function escapeAttr(s) { return s.replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

/* ============================================================
   수량 변경 / 카트 갱신
   ============================================================ */
function bindItemButtons() {
  $("menu-body").querySelectorAll("[data-zoom]").forEach(b =>
    b.addEventListener("click", () => openPhoto(b.dataset.zoom)));
  $("menu-body").querySelectorAll("[data-add]").forEach(b =>
    b.addEventListener("click", () => changeQty(b.dataset.add, +1)));
  $("menu-body").querySelectorAll("[data-plus]").forEach(b =>
    b.addEventListener("click", () => changeQty(b.dataset.plus, +1)));
  $("menu-body").querySelectorAll("[data-minus]").forEach(b =>
    b.addEventListener("click", () => changeQty(b.dataset.minus, -1)));
}

function changeQty(name, delta) {
  const c = carts[currentId] || (carts[currentId] = {});
  const next = (c[name] || 0) + delta;
  if (next <= 0) delete c[name]; else c[name] = next;
  save("menu-carts", carts);
  updateItemStates();
  renderCarts();
}

/* 이름으로 아이템 카드의 컨트롤만 부분 갱신 (전체 리렌더 X) */
function openPhoto(name) {
  const it = findItem(name);
  if (!it || !it.img) return;
  $("lightbox-img").src = it.img;
  $("lightbox-img").alt = it.name;
  $("lightbox-cap").innerHTML =
    `${it.name} · ${fmtPrice(it.price, rest().currency)}${it.cn ? `<span>${it.cn}</span>` : ""}`;
  $("lightbox").hidden = false;
}
function closePhoto() { $("lightbox").hidden = true; }
$("lightbox").addEventListener("click", closePhoto);
document.addEventListener("keydown", e => { if (e.key === "Escape") closePhoto(); });

function updateItemStates() {
  const c = carts[currentId];
  document.querySelectorAll("#menu-body .item").forEach(row => {
    const name = row.dataset.name;
    const it = findItem(name);
    if (!it || isMarket(it.price)) return; // 시가 메뉴는 항상 비활성 유지
    const qty = c[name] || 0;
    const ctrl = row.querySelector(".add-btn, .stepper");
    const hasStepper = !!row.querySelector(".stepper");
    row.classList.toggle("in-cart", qty > 0);

    if (qty === 0 && hasStepper) {
      // 스테퍼 → 추가 버튼
      ctrl.insertAdjacentHTML("beforebegin", addBtnHtml(it));
      ctrl.previousElementSibling.addEventListener("click", () => changeQty(name, +1));
      ctrl.remove();
    } else if (qty > 0) {
      if (hasStepper) {
        // 수량 숫자만 갱신
        ctrl.querySelector(".qty").textContent = qty;
      } else {
        // 추가 버튼 → 스테퍼
        ctrl.insertAdjacentHTML("beforebegin", stepperHtml(name, qty));
        const st = ctrl.previousElementSibling;
        st.querySelector("[data-plus]").addEventListener("click", () => changeQty(name, +1));
        st.querySelector("[data-minus]").addEventListener("click", () => changeQty(name, -1));
        ctrl.remove();
      }
    }
  });
}

function addBtnHtml(it) {
  return `<button class="add-btn" data-add="${escapeAttr(it.name)}" aria-label="${it.name} 담기">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>`;
}

function findItem(name) {
  return rest().categories.flatMap(c => c.items).find(i => i.name === name);
}

/* ============================================================
   장바구니 렌더링 (하단바 + 시트 + 사이드바)
   ============================================================ */
function cartEntries() {
  const c = carts[currentId];
  return Object.keys(c)
    .map(name => ({ item: findItem(name), qty: c[name] }))
    .filter(e => e.item);
}

function cartTotal() {
  return cartEntries().reduce((sum, e) => sum + e.item.price * e.qty, 0);
}

function renderCarts() {
  const r = rest();
  const entries = cartEntries();
  const total = cartTotal();
  const count = entries.reduce((n, e) => n + e.qty, 0);

  /* --- 모바일 하단 바 --- */
  const bar = $("cartbar");
  if (!count) {
    bar.innerHTML = `<div class="cartbar-empty">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 3h2l2.6 12.5h10.8L21 7H6"/></svg>
        메뉴를 담으면 총액이 여기 표시됩니다
      </div>`;
  } else {
    bar.innerHTML = `
      <button class="cartbar-btn" id="open-sheet">
        <span class="badge num">${count}</span>
        <span class="grow">장바구니 보기</span>
        <span class="total num">${fmtPrice(total, r.currency)}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>`;
    $("open-sheet").addEventListener("click", openSheet);
  }

  /* --- 시트 & 사이드바 공통 목록 --- */
  const listHtml = entries.length
    ? entries.map(e => `
        <div class="cart-item">
          <div class="ci-info">
            <div class="ci-name">${e.item.name}${e.item.cn ? `<span class="ci-cn">(${e.item.cn})</span>` : ""}</div>
            <div class="ci-sub num">${fmtPrice(e.item.price, r.currency)} × ${e.qty} = ${fmtPrice(e.item.price * e.qty, r.currency)}</div>
          </div>
          ${stepperHtml(e.item.name, e.qty)}
        </div>`).join("")
    : `<div class="sheet-empty">아직 담은 메뉴가 없습니다.</div>`;

  for (const listId of ["sheet-list", "cart-aside-list"]) {
    const el = $(listId);
    el.innerHTML = listHtml;
    el.querySelectorAll("[data-plus]").forEach(b =>
      b.addEventListener("click", () => changeQty(b.dataset.plus, +1)));
    el.querySelectorAll("[data-minus]").forEach(b =>
      b.addEventListener("click", () => changeQty(b.dataset.minus, -1)));
  }

  $("total-sheet").textContent = fmtPrice(total, r.currency);
  $("total-desktop").textContent = fmtPrice(total, r.currency);
}

/* ============================================================
   시트 열기/닫기
   ============================================================ */
function openSheet() {
  $("sheet").classList.add("open");
  $("sheet-backdrop").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  $("sheet").classList.remove("open");
  $("sheet-backdrop").classList.remove("open");
  document.body.style.overflow = "";
}

/* ============================================================
   테마
   ============================================================ */
function applyTheme() {
  const root = document.documentElement;
  if (themePref) root.dataset.theme = themePref;
  else delete root.dataset.theme;
  const dark = themePref === "dark" ||
    (!themePref && matchMedia("(prefers-color-scheme: dark)").matches);
  $("icon-moon").hidden = dark;
  $("icon-sun").hidden = !dark;
}
function toggleTheme() {
  const dark = themePref === "dark" ||
    (!themePref && matchMedia("(prefers-color-scheme: dark)").matches);
  themePref = dark ? "light" : "dark";
  save("menu-theme", themePref);
  applyTheme();
}

/* ============================================================
   헤더 높이 측정 → 사이드바 위치 변수 갱신
   ============================================================ */
function measureTopbar() {
  const bar = document.querySelector(".topbar");
  if (!bar) return;
  const h = bar.offsetHeight;
  document.documentElement.style.setProperty("--topbar-h", h + "px");
}

/* ============================================================
   검색 & 칩 & 스크롤 연동
   ============================================================ */
let searchTimer;
$("search-input").addEventListener("input", (e) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    renderMenu(e.target.value);
    syncChips(); // 검색 중에는 활성 칩 해제
  }, 120);
});

$("chip-row").addEventListener("click", (e) => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  $("chip-row").querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
  chip.classList.add("active");
  const cat = chip.dataset.cat;
  if (cat === "all") {
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    const sec = $("cat-" + cat);
    if (sec) {
      // 스티키 헤더 높이만큼 보정해서 섹션 제목이 헤더에 가려지지 않게
      const barH = document.querySelector(".topbar").offsetHeight;
      const y = sec.getBoundingClientRect().top + window.scrollY - barH - 8;
      window.scrollTo({ top: Math.max(0, y), behavior: "smooth" });
    }
  }
});

function syncChips() {
  const chips = [...$("chip-row").querySelectorAll(".chip")];
  const barEl = document.querySelector(".topbar");
  const barH = barEl ? barEl.offsetHeight : 0;
  const trigger = barH + 12; // 헤더 바로 아래를 지나면 해당 칩 활성화
  let active = chips[0];
  for (const chip of chips) {
    if (chip.dataset.cat === "all") continue;
    const sec = $("cat-" + chip.dataset.cat);
    if (sec && sec.getBoundingClientRect().top <= trigger) active = chip;
  }
  chips.forEach(c => c.classList.toggle("active", c === active));
}
let scrollTick;
window.addEventListener("scroll", () => {
  if (scrollTick) return;
  scrollTick = requestAnimationFrame(() => { syncChips(); scrollTick = null; });
}, { passive: true });

/* ============================================================
   초기화
   ============================================================ */
$("btn-back").addEventListener("click", () => {
  closeSheet();
  $("screen-menu").hidden = true;
  $("screen-home").hidden = false;
  document.documentElement.style.removeProperty("--accent");
  document.documentElement.style.removeProperty("--accent-2");
  document.documentElement.style.removeProperty("--on-accent");
  window.scrollTo(0, 0);
});
$("btn-theme").addEventListener("click", toggleTheme);
$("sheet-backdrop").addEventListener("click", closeSheet);
$("btn-clear-sheet").addEventListener("click", () => { clearCart(); });
$("btn-clear-desktop").addEventListener("click", () => { clearCart(); });

function clearCart() {
  if (!Object.keys(carts[currentId]).length) return;
  if (!confirm("담은 메뉴를 모두 비울까요?")) return;
  carts[currentId] = {};
  save("menu-carts", carts);
  renderMenu($("search-input").value);
  renderCarts();
}

applyTheme();
renderHome();
measureTopbar();
addEventListener("resize", () => {
  measureTopbar();
  syncChips();
});
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
